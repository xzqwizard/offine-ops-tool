# windows-gnu 工具链链接方案（lld）说明：
# 部分 MinGW GNU ld 组合在大型测试二进制上存在启动兼容性问题，
# 此配置使用 rust-lld（同时检查重复资源）。MSVC 发布使用标准 Cargo 配置。
# - lld 禁止重复资源：gcc specs 默认注入 default-manifest.o 会与 Tauri 内嵌
#   清单冲突，build.rs 注入 -specs= 指向 .cargo/mingw-specs-nodm.txt
#   （由 `gcc -dumpspecs` 去除 default-manifest 注入生成）规避。
# - linker-features 为 unstable 标志，需 RUSTC_BOOTSTRAP + -Z unstable-options。
[env]
RUSTC_BOOTSTRAP = "1"

[target.x86_64-pc-windows-gnu]
rustflags = ["-Z", "unstable-options", "-C", "linker-features=+lld"]

# crates.io 国内镜像（直连 crates.io 不稳时兜底）
[source.crates-io]
replace-with = 'rsproxy-sparse'
[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"
[registries.rsproxy]
index = "sparse+https://rsproxy.cn/index/"
