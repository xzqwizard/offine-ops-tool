[package]
name = "offline-preops-tool"
version = "0.1.0"
description = "离线部署运维工具"
authors = ["xzq"]
edition = "2021"

[lib]
name = "offline_preops_tool_lib"
# 桌面应用仅需 rlib；去掉 cdylib/staticlib 以兼容 windows-gnu(MinGW) 工具链
# （cdylib 在 MinGW 下触发 "export ordinal too large" 链接错误）
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
minijinja = "2"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1"
rust_xlsxwriter = "0.99.1"
serde_yaml = "0.9.34"
fs2 = "0.4.3"
zip = "8.6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
