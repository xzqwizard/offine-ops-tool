[package]
name = "offline-preops-tool"
version = "0.1.0"
description = "离线部署运维工具"
authors = ["xzq"]
edition = "2021"

[lib]
name = "offline_preops_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
